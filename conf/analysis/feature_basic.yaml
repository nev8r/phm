name: feature_basic
enabled: true
version: v1

feature_source: raw

scope:
  fit_scope: train_only
  report_splits:
    - train
    - val
    - test
    - all

summary:
  enabled: true
  describe: true
  variance: true
  missing: true
  finite_check: true

curves:
  enabled: true
  max_bearings: 5
  top_features: []
  default_features:
    - h__time__rms
    - v__time__rms
    - mag__time__rms
    - h__time__kurtosis
    - v__time__kurtosis

store:
  write_csv: true
  write_figures: true
