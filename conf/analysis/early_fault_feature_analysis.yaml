name: early_fault_feature_analysis
enabled: true
version: v1

feature_source: raw

scope:
  fit_scope: train_only
  report_splits:
    - train
    - val
    - test

targets:
  early_fault: early_fault

early_fault:
  enabled: true
  target_column: early_fault
  effect_size: true
  auc: true
  mean_shift: true
  before_after_fpt: true

ranking:
  enabled: true
  score:
    effect_size_weight: 0.5
    auc_weight: 0.5

store:
  write_csv: true
  write_figures: true
