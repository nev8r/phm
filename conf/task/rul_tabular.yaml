name: rul_tabular
enabled: true
version: v1

task_type: regression
input_mode: tabular

feature_source: cleaned
feature_columns:
  include: all
  include_patterns: []
  exclude_patterns: []
  exclude_columns: []

target:
  columns:
    - piecewise_rul_norm
  dtype: float32

metadata:
  keep_columns:
    - sample_uid
    - dataset
    - bearing_id
    - condition_id
    - source_group
    - sample_id
    - timestep

store:
  write_csv: true
  save_arrays: false
