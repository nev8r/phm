name: health_state_sequence
enabled: true
version: v1

task_type: multiclass_classification
input_mode: feature_sequence

feature_source: cleaned
feature_columns:
  include: all
  include_patterns: []
  exclude_patterns: []
  exclude_columns: []

sequence:
  length: 8
  stride: 1
  target_position: last
  drop_incomplete: true
  allow_cross_bearing: false
  allow_cross_split: false

target:
  columns:
    - health_state_id
  dtype: int64
  num_classes: 4

metadata:
  keep_columns:
    - sample_uid
    - dataset
    - bearing_id
    - condition_id
    - source_group
    - sample_id
    - timestep

store:
  write_csv: true
  save_arrays: false
