name: base
enabled: true

device: auto
dtype: float32
seed: ${project.seed}

max_epochs: 50
batch_size: 16
num_workers: 0
pin_memory: false

optimizer:
  name: adam
  lr: 0.001
  weight_decay: 0.0

scheduler:
  name: none

loss:
  name: auto

metrics:
  name: auto

monitor:
  split: val
  metric: loss
  mode: min

gradient:
  clip_norm: 5.0

eval:
  every_n_epochs: 1
  evaluate_train: false
  evaluate_test_at_end: true

checkpoint:
  enabled: true
  save_best: true
  save_last: true
  resume_from: null

prediction:
  save_train: false
  save_val: true
  save_test: true
  write_csv: false
