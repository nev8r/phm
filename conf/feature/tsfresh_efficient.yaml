name: tsfresh_efficient
enabled: true
version: v1

backends:
  - name: tsfresh_efficient
    type: tsfresh
    params:
      fc_parameters: efficient
      n_jobs: 4
      chunksize: null
      disable_progressbar: true
      include_magnitude: false
      prefix: tsfresh

cleaner:
  enabled: true
  imputer: median
  scaler: standard
  drop_constant: true
  constant_threshold: 1.0e-12
  fit_scope: train_only

store:
  write_csv: false
